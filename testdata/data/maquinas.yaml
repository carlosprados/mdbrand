# A catalogue as a proposal would carry it: keyed by id, ids with dots, a shared
# base merged into each entry, numbers without units and written as they are.
_base: &base {familia: m5, disco: 50}
m5.large:    {<<: *base, cpu: 2, ram: 8,  precio: 0.096, uso: "Entornos de desarrollo y pruebas con carga baja y sostenida, sin picos"}
m5.xlarge:   {<<: *base, cpu: 4, ram: 16, precio: 0.192, disco: 100, uso: "Servicios de aplicación con tráfico moderado y bases de datos pequeñas"}
c6i.2xlarge: {familia: c6i, cpu: 8, ram: 16, disco: 100, precio: 0.34, uso: "Cómputo intensivo: inferencia por lotes, compilación y codificación de vídeo"}

<?xml version="1.0" encoding="UTF-8"?>
<!-- An invented mark: an orange disc and a pale bar, both legible on the
     deck's dark ground, so the logo contrast check passes on purpose. -->
<svg xmlns="http://www.w3.org/2000/svg" width="400" height="100" viewBox="0 0 400 100">
  <circle cx="50" cy="50" r="40" style="fill:#e8710a"/>
  <rect x="110" y="35" width="270" height="30" rx="6" fill="#B8BCC0"/>
</svg>

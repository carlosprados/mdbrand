# golangci-lint v2. `just lint` runs it; CI runs it on every push.
#
# Two kinds of rule live here. depguard holds the architecture: the direction
# of the imports, which CLAUDE.md used to state and nothing used to check —
# it had already drifted when the rules were written. The rest catches the
# shapes that grow into defects: an error dropped on the floor, a function no
# one can hold in their head.
#
# Existing offenders are listed by name under exclusions, not hidden behind a
# looser threshold. Shrinking that list is the work; growing it needs a reason
# written next to the entry.
version: "2"

linters:
  default: none
  enable:
    - depguard
    - errcheck
    - gocognit
    - govet
    - ineffassign
    - staticcheck
    - unused

  settings:
    depguard:
      rules:
        # cmd is the composition root and may reach any package. Below it,
        # build is the only orchestrator: the packages it drives know nothing
        # of the pipeline, so a second output format can be added beside the
        # first without either learning about the other.
        no-upward:
          files:
            - "**/internal/**"
          deny:
            - pkg: github.com/carlosprados/mdbrand/cmd
              desc: internal packages never depend on the CLI
        leaves-below-build:
          files:
            - "**/internal/**"
            - "!**/internal/build/**"
          deny:
            - pkg: github.com/carlosprados/mdbrand/internal/build
              desc: only cmd drives the pipeline; move the shared piece down instead
        # The two output formats know nothing of each other. docx is a pure
        # leaf — bytes and numbers in, bytes out — and build is what tells it
        # what the brand means, as it does for tex.
        docx-is-a-leaf:
          files:
            - "**/internal/docx/**"
          deny:
            - pkg: github.com/carlosprados/mdbrand/internal
              desc: internal/docx takes plain values from build; it imports no other package of mdbrand
        tex-knows-no-docx:
          files:
            - "**/internal/tex/**"
          deny:
            - pkg: github.com/carlosprados/mdbrand/internal/docx
              desc: the PDF's LaTeX and the .docx are separate formats
        # Every external command goes through internal/run, which is what puts
        # the tool's own output into the error when it fails.
        exec-through-run:
          files:
            - $all
            - "!**/internal/run/**"
          deny:
            - pkg: os/exec
              desc: run external commands through internal/run

    errcheck:
      exclude-functions:
        # Printing to the terminal: a failed write there has nowhere to go.
        - fmt.Fprint
        - fmt.Fprintf
        - fmt.Fprintln
        # Best-effort cleanup of temporary files and directories.
        - os.Remove
        - os.RemoveAll

    gocognit:
      min-complexity: 40

    staticcheck:
      checks:
        - all
        # Error messages here are paragraphs that name the fix, punctuation
        # included, on purpose.
        - -ST1005
        # Package comments and naming conventions the codebase does not follow.
        - -ST1000
        - -ST1003
        # Rewrites offered as suggestions, not defects.
        - -QF*

  exclusions:
    rules:
      - path: _test\.go
        linters: [errcheck]

      # Debt, by name. Each one goes when its function is next touched.
      - path: internal/data/table.go
        text: "func `render`"
        linters: [gocognit]
      - path: internal/mdtext/mdtext.go
        text: "func `Protected`"
        linters: [gocognit]
      - path: cmd/doctor.go
        text: os/exec
        linters: [depguard] # exec.LookPath; internal/run needs a Path helper
      - path: internal/data/list.go
        text: filepath.WalkDir
        linters: [errcheck] # an unreadable data dir lists as empty
      - path: internal/build/build.go
        text: tmp.Close
        linters: [errcheck] # error paths that already return the write error
      # Close is not excluded wholesale: after a write, its error is the only
      # report of a file that never reached the disk. These two only read.
      - path: internal/imgsize/imgsize.go
        text: f.Close
        linters: [errcheck]
      - path: internal/watch/watch.go
        text: w.Close
        linters: [errcheck]

formatters:
  enable:
    - gofmt

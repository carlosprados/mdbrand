name: ci

# Tests on every push and pull request. It also exercises the same actions the
# release workflow uses, so a broken action version shows up here instead of
# during a release.
on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Formatting
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "gofmt needed on:"; echo "$unformatted"; exit 1
          fi
      - run: go vet ./...
      - run: go test ./...
      - name: Build
        run: go build ./...

  # The tests above cover the arithmetic. This covers the artifact, which is
  # where every defect this tool has shipped actually lived: a code block past
  # the margin, a glob that refused to compile, a path resolved twice. None of
  # them was visible to `go test`; all of them were obvious in a PDF or a log.
  document:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          check-latest: true
      - name: Build the binary the fixtures will use
        run: go build -o mdbrand .
      - uses: ./.github/actions/document-toolchain
      - name: Fixtures
        run: make torture
      - name: The bundled example, with no bundle configured
        run: make example

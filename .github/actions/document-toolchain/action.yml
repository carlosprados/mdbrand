name: document toolchain
description: >
  Installs everything mdbrand conducts, so a runner can build a document and not
  merely compile the binary. Kept in one place because two workflows need it and
  a version that drifts between them would be found during a release.

runs:
  using: composite
  steps:
    - name: pandoc, XeLaTeX, librsvg, poppler
      shell: bash
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        # texlive-latex-extra carries fancyhdr and fvextra; fonts-recommended
        # carries Latin Modern, which is what `--brand none` sets type in, and
        # the lmodern package carries the .sty that pandoc's own template loads
        # — without it every build dies before reaching mdbrand's preamble.
        # poppler-utils is how the fixtures read the PDF back.
        sudo apt-get install -y --no-install-recommends \
          pandoc \
          texlive-xetex \
          texlive-latex-base \
          texlive-latex-recommended \
          texlive-latex-extra \
          texlive-fonts-recommended \
          lmodern \
          librsvg2-bin \
          poppler-utils

    - name: d2
      shell: bash
      env:
        # Pinned, and not the install script: the fixtures assert behaviour that
        # belongs to this version of d2 — containers that group without
        # reshaping, globs that descend into vars — so the version is part of
        # what is being tested. `curl | sh` would also put an unreviewed script
        # in the path of every build.
        D2_VERSION: 0.7.1
      run: |
        set -euo pipefail
        url="https://github.com/terrastruct/d2/releases/download/v${D2_VERSION}/d2-v${D2_VERSION}-linux-amd64.tar.gz"
        curl -fsSL "$url" -o /tmp/d2.tar.gz
        tar -xzf /tmp/d2.tar.gz -C /tmp
        sudo install -m755 "/tmp/d2-v${D2_VERSION}/bin/d2" /usr/local/bin/d2
        d2 --version

    - name: vega-lite
      shell: bash
      run: |
        set -euo pipefail
        npm i -g --no-fund --no-audit vega-cli vega-lite
        vl2svg --help >/dev/null 2>&1 || true

    - name: What the tool thinks it has
      shell: bash
      run: ./mdbrand doctor || true

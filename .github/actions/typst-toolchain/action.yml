name: typst toolchain
description: >
  Installs what engine typst needs on top of the document toolchain: Typst
  itself, and a pandoc whose Typst writer it reads. Ubuntu's pandoc (3.1.3 on
  noble) cites with strings where Typst 0.15 wants labels, so it replaces the
  apt one — in this job only, since the XeLaTeX fixtures assert on 3.1.3.

runs:
  using: composite
  steps:
    - name: pandoc, pandoc-crossref and typst
      shell: bash
      env:
        # Pinned together: mdbrand refuses a pandoc-crossref built for another
        # pandoc, and v0.3.22 is built with 3.8.2. Typst is pinned because the
        # fixtures assert on what its layout measures.
        PANDOC_VERSION: 3.8.2
        PANDOC_CROSSREF_VERSION: v0.3.22
        TYPST_VERSION: 0.15.1
      run: |
        set -euo pipefail
        curl -fsSL "https://github.com/jgm/pandoc/releases/download/${PANDOC_VERSION}/pandoc-${PANDOC_VERSION}-1-amd64.deb" -o /tmp/pandoc.deb
        sudo dpkg -i /tmp/pandoc.deb
        hash -r
        pandoc --version | head -1
        curl -fsSL "https://github.com/lierdakil/pandoc-crossref/releases/download/${PANDOC_CROSSREF_VERSION}/pandoc-crossref-Linux-X64.tar.xz" -o /tmp/pandoc-crossref.tar.xz
        tar -xJf /tmp/pandoc-crossref.tar.xz -C /tmp
        sudo install -m755 /tmp/pandoc-crossref /usr/local/bin/pandoc-crossref
        pandoc-crossref --version
        curl -fsSL "https://github.com/typst/typst/releases/download/v${TYPST_VERSION}/typst-x86_64-unknown-linux-musl.tar.xz" -o /tmp/typst.tar.xz
        tar -xJf /tmp/typst.tar.xz -C /tmp
        sudo install -m755 /tmp/typst-x86_64-unknown-linux-musl/typst /usr/local/bin/typst
        typst --version
